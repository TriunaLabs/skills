<title id="title">Scan to Comprehend</title><desc id="desc">Three linked reading stages: orient, locate, understand, with example headings and context.</desc>
<rect width="1200" height="675" fill="#f7f7f2"/><rect x="40" y="40" width="1120" height="595" rx="20" fill="#fff" stroke="#d8e1d9"/>
<text x="84" y="98" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0d6b4e">SCAN TO COMPREHEND</text>
<text x="84" y="161" font-family="Arial,sans-serif" font-size="43" font-weight="700" fill="#17211b">From a quick scan to a clear answer.</text>
<g font-family="Arial,sans-serif"><g transform="translate(84 221)"><rect width="310" height="275" rx="12" fill="#f4f8f4" stroke="#bfd3c2"/><text x="24" y="47" font-size="17" fill="#0d6b4e" font-weight="700">01 / ORIENT</text><text x="24" y="93" font-size="25" fill="#17211b" font-weight="700">What is this about?</text><path d="M24 125h245M24 145h208" stroke="#bccdc0" stroke-width="10"/><text x="24" y="208" font-size="16" fill="#3b5143">Specific title + concise overview</text></g><g transform="translate(445 221)"><rect width="310" height="275" rx="12" fill="#f4f8f4" stroke="#bfd3c2"/><text x="24" y="47" font-size="17" fill="#0d6b4e" font-weight="700">02 / LOCATE</text><text x="24" y="93" font-size="25" fill="#17211b" font-weight="700">Where is my answer?</text><path d="M24 130h189M24 154h245M24 178h175" stroke="#0d6b4e" stroke-width="8"/><text x="24" y="225" font-size="16" fill="#3b5143">Descriptive headings + labels</text></g><g transform="translate(806 221)"><rect width="310" height="275" rx="12" fill="#f4f8f4" stroke="#bfd3c2"/><text x="24" y="47" font-size="17" fill="#0d6b4e" font-weight="700">03 / UNDERSTAND</text><text x="24" y="93" font-size="25" fill="#17211b" font-weight="700">What does it mean?</text><rect x="24" y="122" width="98" height="63" rx="5" fill="#cde4d1"/><path d="M146 130h137M146 153h109M146 176h120" stroke="#bccdc0" stroke-width="9"/><text x="24" y="225" font-size="16" fill="#3b5143">Context, caveats + evidence</text></g></g>
