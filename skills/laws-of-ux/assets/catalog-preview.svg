<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Laws of UX interface review</title><desc id="desc">Four evidence-backed findings connected to a reviewed interface.</desc>
<rect width="1200" height="675" fill="#f5f2e9"/><text x="70" y="78" font-family="Georgia,serif" font-size="42" fill="#152c25">Laws of UX <tspan font-style="italic" fill="#1f6b45">Review</tspan></text><text x="70" y="112" font-family="Arial,sans-serif" font-size="17" fill="#68746e">OBSERVE · EXPLAIN · CHANGE · VERIFY</text>
<rect x="410" y="62" width="380" height="555" rx="20" fill="#fffdf8" stroke="#bfcac2" stroke-width="2"/><circle cx="438" cy="88" r="6" fill="#d8ddd7"/><circle cx="458" cy="88" r="6" fill="#d8ddd7"/><rect x="452" y="137" width="296" height="122" rx="10" fill="#e5efda"/><rect x="500" y="166" width="200" height="14" rx="7" fill="#91ae85"/><rect x="548" y="208" width="104" height="30" rx="8" fill="#183d31"/><rect x="452" y="290" width="88" height="145" rx="10" fill="#eef3e9"/><rect x="552" y="290" width="88" height="145" rx="10" fill="#d9ead7"/><rect x="652" y="290" width="88" height="145" rx="10" fill="#eef3e9"/><rect x="452" y="468" width="288" height="18" rx="9" fill="#e9e5dc"/><rect x="452" y="502" width="238" height="18" rx="9" fill="#e9e5dc"/>
<g font-family="Arial,sans-serif"><g transform="translate(55 165)"><rect width="300" height="120" rx="12" fill="#fffdf8" stroke="#d3d9d2"/><circle cx="30" cy="30" r="18" fill="#d8eadc"/><text x="30" y="36" text-anchor="middle" font-weight="700" fill="#1f6b45">1</text><text x="60" y="31" font-weight="700" font-size="17" fill="#18332a">Hick's Law</text><text x="60" y="55" font-size="12" fill="#647069">HIGH · 94% · HERO ACTIONS</text><text x="22" y="86" font-size="14" fill="#253a33">Four equal actions compete.</text><text x="22" y="107" font-size="13" fill="#1f6b45">Keep one primary action.</text></g><g transform="translate(845 165)"><rect width="300" height="120" rx="12" fill="#fffdf8" stroke="#d3d9d2"/><circle cx="30" cy="30" r="18" fill="#d8eadc"/><text x="30" y="36" text-anchor="middle" font-weight="700" fill="#1f6b45">2</text><text x="60" y="31" font-weight="700" font-size="17" fill="#18332a">Von Restorff</text><text x="60" y="55" font-size="12" fill="#647069">MEDIUM · 90% · PLAN GRID</text><text x="22" y="86" font-size="14" fill="#253a33">Every plan has equal emphasis.</text><text x="22" y="107" font-size="13" fill="#1f6b45">Distinguish one recommendation.</text></g><g transform="translate(55 365)"><rect width="300" height="120" rx="12" fill="#fffdf8" stroke="#d3d9d2"/><circle cx="30" cy="30" r="18" fill="#d8eadc"/><text x="30" y="36" text-anchor="middle" font-weight="700" fill="#1f6b45">3</text><text x="60" y="31" font-weight="700" font-size="17" fill="#18332a">Miller's Law</text><text x="60" y="55" font-size="12" fill="#647069">MEDIUM · 88% · FEATURES</text><text x="22" y="86" font-size="14" fill="#253a33">Nine peer items form one group.</text><text x="22" y="107" font-size="13" fill="#1f6b45">Chunk under three headings.</text></g><g transform="translate(845 365)"><rect width="300" height="120" rx="12" fill="#fffdf8" stroke="#d3d9d2"/><circle cx="30" cy="30" r="18" fill="#d8eadc"/><text x="30" y="36" text-anchor="middle" font-weight="700" fill="#1f6b45">4</text><text x="60" y="31" font-weight="700" font-size="17" fill="#18332a">Peak-End Rule</text><text x="60" y="55" font-size="12" fill="#647069">HIGH · 86% · COMPLETION</text><text x="22" y="86" font-size="14" fill="#253a33">The flow ends without direction.</text><text x="22" y="107" font-size="13" fill="#1f6b45">Confirm outcome and next step.</text></g></g>
<g stroke="#8eb09b" stroke-width="2" fill="none"><path d="M355 225 C390 225 390 205 500 205"/><path d="M845 225 C810 225 810 345 596 345"/><path d="M355 425 C390 425 390 380 500 380"/><path d="M845 425 C810 425 810 520 690 520"/></g>
<text x="600" y="648" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#68746e">Ground every principle in observable evidence. Make every recommendation verifiable.</text>
</svg>
