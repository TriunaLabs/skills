name: Validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests
      - run: node --test tests/s2c_section_signals.test.cjs
      - run: node tests/check_install_wizard.cjs
      - run: node --test tests/test_s2c_public_browser_guard.mjs
      - run: python -m pip install -r skills/scan-to-comprehend/integrations/requirements-mcp.txt
      - run: python -m unittest tests.test_s2c_mcp
        env:
          S2C_TEST_MCP: '1'
      - run: python scripts/build.py
